# Sim-Sequence Utility — Automotive body-shop weld sequence sample
# Copy and edit for your own project.

settings:
  available_time: 3600       # total time budget (seconds)
  takt_time: 60              # target cycle time / line rate (seconds)
  time_increment: 1          # grid column resolution on granular sheets (seconds)
  output_file: outputs/sequence_report.xlsx

resources:
  - id: Operator_1
    color: "#1F4E78"   # dark blue
  - id: Robot_A
    color: "#4CAF50"   # green
  - id: Robot_B
    color: "#FF9800"   # orange
  - id: Tool_Fixture
    color: "#9C27B0"   # purple

tasks:
  # ── Operator_1 ──────────────────────────────────────────────────────────
  - id: Op1_GetPart
    name: "Get Part from Rack"
    resource: Operator_1
    duration: 4
    predecessors_fs: []
    predecessors_ss: []

  - id: Op1_Load
    name: "Load Part to Fixture"
    resource: Operator_1
    duration: 5
    predecessors_fs: [Op1_GetPart]
    predecessors_ss: []

  - id: Op1_SafetyCheck
    name: "Safety Check / Clear Zone"
    resource: Operator_1
    duration: 2
    predecessors_fs: [Op1_Load]
    predecessors_ss: []

  - id: Op1_Unload
    name: "Unload Finished Part"
    resource: Operator_1
    duration: 4
    predecessors_fs: [RobA_Weld2, RobB_Weld2]
    predecessors_ss: []

  # ── Robot_A (left side) ─────────────────────────────────────────────────
  - id: RobA_MoveIn
    name: "Robot A Move-In"
    resource: Robot_A
    duration: 3
    predecessors_fs: [Op1_SafetyCheck]
    predecessors_ss: []

  - id: RobA_Weld1
    name: "Robot A — Weld Pass 1"
    resource: Robot_A
    duration: 10
    predecessors_fs: [RobA_MoveIn]
    predecessors_ss: []

  - id: RobA_Reposition
    name: "Robot A — Reposition"
    resource: Robot_A
    duration: 2
    predecessors_fs: [RobA_Weld1]
    predecessors_ss: []

  - id: RobA_Weld2
    name: "Robot A — Weld Pass 2"
    resource: Robot_A
    duration: 8
    predecessors_fs: [RobA_Reposition]
    predecessors_ss: []

  - id: RobA_MoveOut
    name: "Robot A Move-Out"
    resource: Robot_A
    duration: 3
    predecessors_fs: [RobA_Weld2]
    predecessors_ss: []

  # ── Robot_B (right side, starts in parallel with Robot_A) ───────────────
  - id: RobB_MoveIn
    name: "Robot B Move-In"
    resource: Robot_B
    duration: 3
    predecessors_fs: [Op1_SafetyCheck]
    predecessors_ss: []

  - id: RobB_Weld1
    name: "Robot B — Weld Pass 1"
    resource: Robot_B
    duration: 10
    predecessors_fs: [RobB_MoveIn]
    predecessors_ss: [RobA_Weld1]  # SS interlock: both robots weld in sync

  - id: RobB_Reposition
    name: "Robot B — Reposition"
    resource: Robot_B
    duration: 2
    predecessors_fs: [RobB_Weld1]
    predecessors_ss: []

  - id: RobB_Weld2
    name: "Robot B — Weld Pass 2"
    resource: Robot_B
    duration: 8
    predecessors_fs: [RobB_Reposition]
    predecessors_ss: [RobA_Weld2]  # SS interlock: stay in sync for pass 2

  - id: RobB_MoveOut
    name: "Robot B Move-Out"
    resource: Robot_B
    duration: 3
    predecessors_fs: [RobB_Weld2]
    predecessors_ss: []

  # ── Tool_Fixture ────────────────────────────────────────────────────────
  - id: Fix_Clamp
    name: "Clamp Part"
    resource: Tool_Fixture
    duration: 2
    predecessors_fs: [Op1_Load]
    predecessors_ss: []

  - id: Fix_Hold
    name: "Hold During Weld"
    resource: Tool_Fixture
    duration: 24          # holds for entire weld sequence
    predecessors_fs: [Fix_Clamp]
    predecessors_ss: []

  - id: Fix_Unclamp
    name: "Unclamp Part"
    resource: Tool_Fixture
    duration: 2
    predecessors_fs: [RobA_MoveOut, RobB_MoveOut]
    predecessors_ss: []
